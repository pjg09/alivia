name: Publicar versión

# Cada envío a main. La versión la deciden los mensajes de commit, según la
# convención de CONTRIBUTING.md.
#
# No se publica nada si alguna prueba falla: el trabajo "publicar" depende de
# "verificar" y no hay forma de saltárselo.
on:
  push:
    branches: [main]

# Dos envíos seguidos no publican a la vez: el segundo espera. Y no se cancela
# en curso, porque cancelar a mitad de una publicación deja etiquetas sueltas.
concurrency:
  group: publicar-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar
    # Fijada a propósito: ubuntu-latest migra a Ubuntu 26 el 19 de octubre de
    # 2026, en mitad del desarrollo. Subir de versión debe ser una decisión,
    # no algo que ocurra un martes cualquiera.
    runs-on: ubuntu-24.04

    # Este trabajo arranca el proyecto EXACTAMENTE como lo arranca cualquiera
    # de las cuatro máquinas: con docker-compose.yml y nada más.
    #
    # Antes montaba su propio ambiente con `services:` de GitHub Actions, que
    # era una segunda copia de la misma verdad. Ya había derivado: declaraba el
    # puerto 5432 mientras .env.example declaraba 5434. Con un solo ambiente,
    # un compose roto pone la CI en rojo y no se publica versión, que es la
    # única forma de que el fichero no se pudra.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      # Las URLs y los puertos salen del único sitio donde están documentados.
      # Antes este trabajo los declaraba en un bloque `env:`, que era una
      # segunda copia y ya había derivado. Y no vale con no poner nada:
      # verificar-todo.sh resuelve las suyas en variables que NO exporta, así
      # que `npm test` --tarea 4-- arrancaría sin ninguna URL de base de datos.
      # Comprobado. Los puertos de .env.example los vigila verificar-arranque.py
      # contra el compose, así que esto no reintroduce la duplicación.
      - name: Tomar la configuración documentada
        run: cp .env.example .env

      # La misma línea que corre cualquiera de las cuatro máquinas. Son dos
      # órdenes porque `up --wait` da por bueno un servicio efímero con que haya
      # arrancado: sin el `compose wait`, las pruebas corren contra una base a
      # medio poblar y fallan de forma intermitente. Ver docs/ambiente.md.
      - name: Levantar el ambiente
        run: docker compose up -d --wait && docker compose wait migraciones

      # Un solo paso a propósito. Las pruebas se descubren por dónde están
      # --db/pruebas/*.sql, scripts/verificar-*.py y npm test--, así que una
      # prueba nueva entra aquí sin tocar este fichero. Enumerarlas una por una
      # garantizaba que tarde o temprano alguien añadiría una que nadie corre.
      - name: Correr todas las pruebas
        run: ./scripts/verificar-todo.sh

      - name: Registro de los contenedores si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200

  publicar:
    name: Publicar
    needs: verificar        # sin esto, se publicaría con las pruebas en rojo
    runs-on: ubuntu-24.04

    permissions:
      contents: write       # etiquetas, publicaciones y el commit del historial
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release necesita toda la historia y las etiquetas para
          # saber desde dónde analizar.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Publicar versión
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
