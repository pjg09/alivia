name: Publicar versión

# Cada envío a main. La versión la deciden los mensajes de commit, según la
# convención de CONTRIBUTING.md.
#
# No se publica nada si alguna prueba falla: el trabajo "publicar" depende de
# "verificar" y no hay forma de saltárselo.
on:
  push:
    branches: [main]

# Dos envíos seguidos no publican a la vez: el segundo espera. Y no se cancela
# en curso, porque cancelar a mitad de una publicación deja etiquetas sueltas.
concurrency:
  group: publicar-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar
    # Fijada a propósito: ubuntu-latest migra a Ubuntu 26 el 19 de octubre de
    # 2026, en mitad del desarrollo. Subir de versión debe ser una decisión,
    # no algo que ocurra un martes cualquiera.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alivia
          POSTGRES_USER: alivia_propietario
          POSTGRES_PASSWORD: desarrollo
          TZ: America/Bogota
          PGTZ: America/Bogota
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alivia_propietario -d alivia"
          --health-interval 5s --health-timeout 5s --health-retries 10

      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://alivia_app:desarrollo@localhost:5432/alivia
      DATABASE_URL_AVISOS: postgres://alivia_avisos:desarrollo@localhost:5432/alivia
      DATABASE_URL_MIGRACIONES: postgres://alivia_propietario:desarrollo@localhost:5432/alivia
      SMTP_HOST: localhost
      SMTP_PUERTO: "1025"
      MAILPIT_API: http://localhost:8025/api/v1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Aplicar el esquema desde cero
        run: ./db/aplicar.sh --semillas

      # Un solo paso a propósito. Las pruebas se descubren por dónde están
      # --db/pruebas/*.sql, scripts/verificar-*.py y npm test--, así que una
      # prueba nueva entra aquí sin tocar este fichero. Enumerarlas una por una
      # garantizaba que tarde o temprano alguien añadiría una que nadie corre.
      - name: Correr todas las pruebas
        run: ./scripts/verificar-todo.sh

  publicar:
    name: Publicar
    needs: verificar        # sin esto, se publicaría con las pruebas en rojo
    runs-on: ubuntu-24.04

    permissions:
      contents: write       # etiquetas, publicaciones y el commit del historial
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release necesita toda la historia y las etiquetas para
          # saber desde dónde analizar.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Publicar versión
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
