# Ambiente local completo: base de datos y correo. Nada sale a internet.
# Arranque:  docker compose up -d  &&  ./db/aplicar.sh

services:
  postgres:
    image: postgres:16
    container_name: alivia-postgres
    environment:
      POSTGRES_DB: alivia
      POSTGRES_USER: alivia_propietario
      POSTGRES_PASSWORD: desarrollo
      # Fechas y ordenamiento coherentes con el dominio colombiano.
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "5434:5432"   # 5432 y 5433 suelen estar ocupados por otros proyectos
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 no es adorno. Durante la inicialización, el entrypoint de
      # postgres levanta un servidor temporal que escucha SOLO en el socket
      # unix; `pg_isready` sin -h lo encuentra y declara la base sana cuando
      # todavía no acepta conexiones TCP, así que lo que dependa de ella
      # arranca contra un puerto cerrado. Por TCP, «sano» significa lo que dice.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U alivia_propietario -d alivia"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: alivia-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"   # SMTP: aqui escribe la aplicacion
      - "8025:8025"   # Interfaz web y API de consulta
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_postgres:
