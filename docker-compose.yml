# Ambiente completo de Alivia. Nada sale a internet.
#
#     docker compose up -d --wait && docker compose wait migraciones
#
# Esa línea, sola, tiene que dejar el proyecto utilizable en una máquina recién
# clonada: base de datos, esquema aplicado, catálogo sembrado y correo. No hay
# pasos manuales después, y no hace falta ningún .env para arrancar. Tambien
# esta como `npm run arrancar`.
#
# POR QUÉ SON DOS ÓRDENES Y NO UNA. `up --wait` espera a que los servicios
# estén *sanos o corriendo*, y un servicio que corre, termina y sale --como
# `migraciones`-- le vale con haber arrancado. Comprobado: con un efímero de 12
# segundos, `up --wait` devolvió 0 a los 6, con el contenedor todavía dentro.
# Las pruebas corrían entonces contra una base a medio poblar y fallaban de
# forma intermitente, que es la peor clase de fallo. `compose wait migraciones`
# bloquea hasta que termina y devuelve su código de salida.
#
# `up --wait` sí detecta que el efímero salió con error (devuelve 1), y un `up`
# posterior lo vuelve a ejecutar, así que las migraciones nuevas se aplican
# sobre una pila ya levantada. Lo único que no hace es esperar al éxito.
#
# REGLA: este fichero levanta TODO lo que compone la aplicación. Cuando se
# añade una pieza que corre (servidor, interfaz, proceso de avisos), se añade
# aquí en el mismo cambio. El contrato de lo que debe declarar cada servicio
# está en docs/ambiente.md y lo comprueba scripts/verificar-arranque.py, que
# entra solo en la integración continua. Un servicio que no esté aquí es un
# servicio que el resto del equipo no tiene.

name: alivia

services:
  postgres:
    image: postgres:16
    container_name: alivia-postgres
    labels:
      # Qué rol de base de datos usa este servicio. Lo exige
      # scripts/verificar-arranque.py y sostiene la regla 1 de CLAUDE.md:
      # el día que exista el servidor, conectarlo como propietario deja de ser
      # un descuido silencioso y pasa a ser una prueba en rojo.
      alivia.rol-bd: motor
    environment:
      POSTGRES_DB: alivia
      POSTGRES_USER: alivia_propietario
      POSTGRES_PASSWORD: ${POSTGRES_CONTRASENA:-desarrollo}
      # Fechas y ordenamiento coherentes con el dominio colombiano.
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      # 5432 y 5433 suelen estar ocupados por otros proyectos. El puerto
      # publicado se puede mover sin tocar este fichero:
      #     PUERTO_POSTGRES=5440 npm run arrancar
      - "${PUERTO_POSTGRES:-5434}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 no es adorno. Durante la inicialización, el entrypoint de
      # postgres levanta un servidor temporal que escucha SOLO en el socket
      # unix; `pg_isready` sin -h lo encuentra y declara la base sana cuando
      # todavía no acepta conexiones TCP. `migraciones` arrancaba entonces
      # contra un puerto cerrado. Por TCP, «sano» significa lo que dice.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U alivia_propietario -d alivia"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: alivia-mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${PUERTO_SMTP:-1025}:1025"   # SMTP: aquí escribe la aplicación
      - "${PUERTO_MAILPIT:-8025}:8025"   # Interfaz web y API de consulta
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica migraciones y semillas y termina. Es lo que convierte «hay una base
  # vacía» en «hay un proyecto utilizable», y por eso vive aquí y no en un
  # comando que cada quien tiene que acordarse de correr.
  #
  # Al ser efímero, `up --wait` no espera a que acabe: hay que esperarlo con
  # `docker compose wait migraciones`. Lo vigila scripts/verificar-arranque.py,
  # que exige que el comando de arranque documentado espere a cada efímero.
  #
  # Monta solo ./db a propósito: montar el repositorio entero traería el .env
  # de la máquina, cuyas URLs apuntan a localhost y no resuelven dentro de la
  # red de contenedores.
  migraciones:
    image: postgres:16
    container_name: alivia-migraciones
    labels:
      alivia.rol-bd: propietario   # aplicar el esquema es lo único que lo justifica
      alivia.efimero: "true"       # corre, termina y sale; por eso no lleva healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro de la red de compose el anfitrión es «postgres», no «localhost»,
      # y el puerto es el interno 5432, no el publicado.
      DATABASE_URL_MIGRACIONES: postgres://alivia_propietario:${POSTGRES_CONTRASENA:-desarrollo}@postgres:5432/alivia
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - ./db:/alivia/db:ro
    entrypoint: ["/alivia/db/aplicar.sh"]
    command: ["--semillas"]
    restart: "no"

  # Servidor. Tarea 1 del backlog: el esqueleto, con /salud respondiendo para
  # que --wait sepa que arrancó. La tarea 7 lo pasa a Express y hace que /salud
  # informe de verdad del estado de la base y del correo.
  #
  # `depends_on` con service_completed_successfully sobre `migraciones` tiene un
  # efecto lateral útil: en un arranque en frío, esperar a que «api» esté sano
  # implica esperar a que el esquema esté aplicado. El `docker compose wait
  # migraciones` del arranque sigue siendo necesario, porque sobre una pila ya
  # levantada compose no recrea «api» y no habría nada que esperar.
  api:
    build:
      # El contexto es la raíz porque npm ci con espacios de trabajo necesita el
      # package-lock.json de la raíz. Lo que no entra lo dice .dockerignore.
      context: .
      dockerfile: api/Dockerfile
    container_name: alivia-api
    labels:
      alivia.rol-bd: app    # sujeto a RLS. Nunca propietario: regla 1
    depends_on:
      postgres:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    # SIN env_file, y esto es importante. El .env es del proyecto entero y lleva
    # las URLs de los tres roles; pasárselo a un servicio le entrega también la
    # del propietario, que ignora RLS por completo, y la de avisos, que ve los
    # datos de todos los usuarios. Es la decisión 2 de docs/arquitectura.md
    # rota por la puerta de atrás, y sin un solo error.
    #
    # Comprobado: con `env_file: .env`, el contenedor recibía
    # DATABASE_URL_MIGRACIONES, DATABASE_URL_AVISOS y el JWT_SECRETO de
    # plantilla. Lo atrapó scripts/verificar-arranque.py.
    #
    # Un servicio declara lo que necesita, y nada más. Lo que deba poder
    # ajustarse desde el .env entra por sustitución, con su nombre, uno a uno.
    environment:
      # PUERTO no se fija: dentro del contenedor vale el 3000 de la imagen. La
      # variable mueve el puerto PUBLICADO, como PUERTO_POSTGRES con la base.
      TZ: America/Bogota
      PGTZ: America/Bogota
      DATABASE_URL: postgres://alivia_app:${POSTGRES_CONTRASENA:-desarrollo}@postgres:5432/alivia
      SMTP_HOST: mailpit
      SMTP_PUERTO: 1025
      # Una a una y por su nombre, nunca el .env entero. Vacia cuenta como
      # ausente, asi que sin definirla el servidor usa la fecha real.
      FECHA_REFERENCIA: ${FECHA_REFERENCIA:-}
    ports:
      - "${PUERTO:-3000}:3000"
    healthcheck:
      # Con node y no con curl o wget: la imagen no los trae y no vale la pena
      # instalarlos para esto.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  datos_postgres:
